<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmarker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/css/all.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>


    <section class="logo container text-center p-5">
        <h1>Bookmarker</h1>
    </section>

    <section class="body-form container p-5">
        <h4 class="text-center"><i class="fa-solid fa-bookmark "></i> Bookmark your favorite sites <i class="fa-solid fa-bookmark"></i> </h4>

        <div class="my-3">
            <label  class="mt-3 fw-bold"><i class="fa-solid fa-book-bookmark"></i> Site Name</label>
            <input type="text" id="siteName" placeholder="Bookmark Name" class="form-control ">

            <label  class="mt-3 fw-bold"><i class="fa-solid fa-link"></i> Site URL</label>
            <input type="url" id="siteURL" placeholder="Bookmark URL" class="form-control ">

            <button onclick="add()" class="m-3 px-5 text-center d-inline-block btn">Submit</button>
        </div>
    </section>

    <section class="container p-5">
        <table class="table p-2 ">
            <thead>
              <tr>
                <th scope="col" class="text-muted text-center">Name</th>
                <th scope="col" class="text-muted text-center">Website URL</th>
                <th scope="col" class="text-muted text-center">Visit</th>
                <th scope="col" class="text-muted text-center">Delete</th>
              </tr>
            </thead>

            <tbody id="display">
              
             
            </tbody>
          </table>
    </section>




   












    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="./index.js"></script>
</body>
</html>
